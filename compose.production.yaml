name: jirjirak

services:
  db:
    image: postgres:17-alpine
    container_name: jirjirak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jirjirak}
      POSTGRES_USER: ${POSTGRES_USER:-jirjirak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: jirjirak-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-jirjirak};Username=${POSTGRES_USER:-jirjirak};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: jirjirak-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api

volumes:
  postgres_data:
