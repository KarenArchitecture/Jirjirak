name: jirjirak

services:
  db:
    image: postgres:17-alpine
    container_name: jirjirak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jirjirak}
      POSTGRES_USER: ${POSTGRES_USER:-jirjirak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: jirjirak-api
    restart: unless-stopped
    working_dir: /workspace
    command:
      - dotnet
      - run
      - --project
      - src/Jirjirak.Api/Jirjirak.Api.csproj
      - --urls
      - http://0.0.0.0:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-jirjirak};Username=${POSTGRES_USER:-jirjirak};Password=${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - ./backend:/workspace
      - backend_nuget_cache:/root/.nuget/packages
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: jirjirak-frontend
    restart: unless-stopped
    command:
      - sh
      - -c
      - npm install && npm run dev -- --host 0.0.0.0 --port 3000
    environment:
      API_PROXY_TARGET: http://api:8080
      DOCKER_DEV: "true"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  backend_nuget_cache:
  frontend_node_modules:
